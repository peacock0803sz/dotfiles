# 各ホストの system closure をビルドし、peacock0803sz.cachix.org に push する。
# ホストを足すときは matrix.include に { host, config, runner } を 1 行追加する。
#   config: nixosConfigurations.<host> / darwinConfigurations.<host>
#   runner: x86_64-linux = ubuntu-latest / aarch64-linux = ubuntu-24.04-arm / aarch64-darwin = macos-15
# 任意で extra-substituters / extra-trusted-public-keys (ホスト固有キャッシュ) と
# skip-push (ビルドのみで push しない) を指定できる。
# push は .github/scripts/push-free-closure が brew cask / unfree を依存に含まない path だけに絞って行う。
# 依存の奥の unfree (ドライバなど) は判定できないので、そういうホストは skip-push にする。
# 前提: 対象ホストが --impure なしで評価できること。

on:
  push:
    branches: [master]
    paths:
      - flake.nix
      - flake.lock
      - dot_config/nix/**
      - .github/workflows/build-cache.yml
      - .github/scripts/**
  # update-nix.yml は GITHUB_TOKEN で push するため push トリガーが発火しない。完了後に拾う
  workflow_run:
    workflows: [.github/workflows/update-nix.yml]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: build-cache
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: bassoon
            config: nixosConfigurations.bassoon
            runner: ubuntu-latest
          - host: enigma
            config: nixosConfigurations.enigma
            runner: ubuntu-latest
            # CUDA / NVIDIA ドライバは unfree かつ systemPackages 経由でないため判定できず、push しない
            extra-substituters: https://cache.nixos-cuda.org
            extra-trusted-public-keys: cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
            skip-push: true
          - host: overture
            config: nixosConfigurations.overture
            runner: ubuntu-24.04-arm
          - host: nocturne
            config: darwinConfigurations.nocturne
            runner: macos-15
          - host: arpeggio
            config: darwinConfigurations.arpeggio
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.numtide.com https://nix-community.cachix.org ${{ matrix.extra-substituters }}
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= ${{ matrix.extra-trusted-public-keys }}

      # substituter の追加と認証だけ行う。ビルド結果の自動 push は closure ごと送ってしまうので切る
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: peacock0803sz
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build ${{ matrix.host }}
        id: build
        run: |
          out=$(nix build --print-build-logs --no-link --print-out-paths ".#${{ matrix.config }}.config.system.build.toplevel")
          echo "toplevel=$out" >> "$GITHUB_OUTPUT"

      - name: Push ${{ matrix.host }}
        if: ${{ !matrix.skip-push }}
        run: bash .github/scripts/push-free-closure peacock0803sz "${{ matrix.config }}" "${{ steps.build.outputs.toplevel }}"
